# ============================================================
# 个人博客系统 - Nginx 配置
# 容器内路径：/etc/nginx/conf.d/default.conf
# ============================================================
server {
    listen 80;
    server_name _;   # 有域名后改成你的域名，如 blog.example.com

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 前端静态资源（Vue Router history 模式：找不到文件时回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 接口文档（生产环境建议注释掉以下三段）
    location /doc.html {
        proxy_pass http://backend:8080/doc.html;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://backend:8080/webjars/;
    }
    location /v3/ {
        proxy_pass http://backend:8080/v3/;
    }

    # 静态资源缓存 7 天
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
