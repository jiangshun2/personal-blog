# ============================================================
# 个人博客系统后端配置
# 开发环境默认配置；生产环境请新建 application-local.yml 覆盖
# （该文件已被 .gitignore 忽略，不会提交到 Git）
# ============================================================
server:
  port: 8080

spring:
  application:
    name: blog-backend

  # 排除 Spring Security 默认内存用户自动配置：
  # 我们用 JWT + 自己实现的登录，不需要它生成随机密码
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # MySQL 数据源（请改成你本机的账号密码）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # Redis（M1 只配置连接，M5 再启用缓存与限流）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  # 全局 JSON 时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线转驼峰：create_time -> createTime
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，方便观察与学习
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段与取值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略：数据库自增
      id-type: auto

# 自定义 JWT 配置
blog:
  jwt:
    # 签名密钥（HS256 要求至少 32 字节；生产环境务必修改）
    secret: blog-jwt-secret-key-please-change-me-in-production-2026
    # 令牌有效期（小时）
    expire-hours: 24

# 日志
logging:
  level:
    com.blog: debug
