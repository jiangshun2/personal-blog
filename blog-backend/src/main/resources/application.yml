# ============================================================
# 个人博客系统后端配置
# 说明：
#   - 本文件会提交到 Git，只放通用配置与占位值
#   - 真实数据库密码等敏感信息放在 application-local.yml
#     （该文件已被 .gitignore 忽略，不会上传到 GitHub）
#   - 默认激活 local 环境，启动时自动加载 application-local.yml
#   - 生产环境（Docker）通过环境变量覆盖，不需要本文件里的密码
# ============================================================
server:
  port: 8080

spring:
  application:
    name: blog-backend

  # 默认激活 local 环境：会额外加载 application-local.yml
  profiles:
    active: local

  # 排除 Spring Security 默认内存用户自动配置
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # MySQL 数据源（占位默认值，实际以 application-local.yml 或环境变量为准）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

  # Redis（本地开发在 application-local.yml 覆盖；生产用环境变量）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  # 全局 JSON 时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL；生产可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 自定义 JWT 配置（生产环境通过 BLOG_JWT_SECRET 环境变量覆盖）
blog:
  jwt:
    secret: blog-jwt-secret-key-please-change-me-in-production-2026
    expire-hours: 24

logging:
  level:
    com.blog: debug
